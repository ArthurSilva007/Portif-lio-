<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    @keyframes cursor-blink {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes glow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .cursor { animation: cursor-blink 1.2s infinite; }
    .dot1 { animation: dot-pulse 1.5s infinite; }
    .dot2 { animation: dot-pulse 1.5s 0.15s infinite; }
    .dot3 { animation: dot-pulse 1.5s 0.3s infinite; }
    .base { animation: glow 2.2s infinite; }
  </style>
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <rect x="4" y="14" width="56" height="34" rx="5" fill="#12121a" stroke="#38bdf8" stroke-width="2"/>
  <rect x="8" y="18" width="48" height="26" rx="3" fill="#161622"/>
  <text x="12" y="36" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#f8fafc">&lt;/&gt;</text>
  <rect class="cursor" x="38" y="27" width="3" height="11" rx="1" fill="#f97316"/>
  <circle class="dot1" cx="52" cy="24" r="2.5" fill="#8b5cf6"/>
  <circle class="dot2" cx="46" cy="24" r="2.5" fill="#f97316"/>
  <circle class="dot3" cx="40" cy="24" r="2.5" fill="#38bdf8"/>
  <path class="base" d="M10 52 h44 a3 3 0 0 1 3 3 H7 a3 3 0 0 1 3 -3 z" fill="#1a1a25" stroke="#f97316" stroke-width="2"/>
  <rect x="29" y="47" width="6" height="5" rx="1.5" fill="#f97316"/>
</svg>
